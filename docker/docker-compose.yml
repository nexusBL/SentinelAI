services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentinelai-app
    working_dir: /workspace
    command:
      [
        "python",
        "main.py",
        "phase2",
        "--test",
        "testcases/sample_test.json"
      ]
    environment:
      SENTINELAI_BROWSER_HEADLESS: "true"
      SENTINELAI_ARTIFACTS_DIR: /workspace/artifacts
    volumes:
      - ..:/workspace
